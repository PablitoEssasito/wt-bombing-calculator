name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Lets you re-run a deploy by hand from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a push mid-deploy queues behind the one in flight
# instead of racing it, but never cancels a deploy already in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          # The site's own domain has no path of its own to add — GitHub Pages
          # serves this repo under /wt-bombing-calculator instead, and
          # configure-pages already knows which because it read the repo's
          # Pages settings above.
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # A measurement id isn't sensitive — it's visible in any page's own
          # source — so this is a repo variable (Settings > Secrets and
          # variables > Actions > Variables), not a secret. Unset until one is
          # added there, which layout.tsx treats as "no analytics" rather
          # than an error.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
